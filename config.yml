# gki-builder 唯一配置入口
#
# 改这里 + 推送到 main（或在 Actions 页面手动 Run workflow）就会触发编译。
# 触发路径过滤见 .github/workflows/build.yml 的 on.push.paths。

# 自己维护的 kernel/common（你的 fork）。不再从 Google 的 manifest 拉 kernel/common，
# 而是在 repo 工作区里用 local manifest 把 path=common 替换成这个仓库。
kernel:
  repo: https://github.com/aqnya/android13-5.15-vermeer
  # 你的 fork 的分支名（不是 Google manifest 的 common-xxx）。
  branch: main
  # 指定编译的 commit —— 唯一来源就在这里，钉的是这个 fork 的 SHA。
  #   留空 ""          -> 用 branch 的 tip
  #   填 40 位 SHA     -> 精确钉死（推荐，保证可复现）
  commit: ""

# Google 的 kernel manifest：**只用来拉 prebuilts / 构建工具**
# （clang、build-tools、kernel-build-tools、kernel/configs），版本与内核树配套。
# kernel/common 已经被上面的 kernel.repo 替换，manifest 里那份会被 local manifest 移除。
manifest:
  repo: https://android.googlesource.com/kernel/manifest
  # 注意：**这里带 common- 前缀，你自己的 kernel 分支名通常不带**。
  #   kernel/manifest -> common-android13-5.15
  # 其它可选：common-android14-5.15 / common-android14-6.1 / common-android15-6.6 ...
  branch: common-android13-5.15

# 生成 .config 用的 defconfig 目标
defconfig: gki_defconfig
arch: arm64

toolchain:
  # CLANG_VERSION 默认从内核树 common/build.config.constants 自动读取。
  # android13-5.15 / common-android13-5.15 对应 r450784e。留空 = 自动；填了则覆盖。
  clang_version: ""

sync:
  # repo sync 拉哪些项目。留空 = 用默认集合（内核源码 + make 需要的工具链/构建工具），
  # 只 sync 需要的能省不少磁盘和时间。要更多项目（比如 virtual-device）就在这里加。
  projects: []

# 刷机包（AnyKernel3）。模板本体在 ak3/ 目录里，构建时直接用它，不再 clone 上游。
ak3:
  # 刷机包里显示的 kernel.string（recovery 刷入时打印的那行）。
  #   留空 ""   -> 用 ak3/anykernel.sh 里自己写的那串；它还是上游示例时才自动填
  #               "GKI <branch> (<sha12>)"
  #   填字符串  -> 每次构建都强制写成这串
  kernel_string: ""

# ------------------------------------------------------------------
# 开关 config：value 即写入 .config 的取值
#   y / n / m         -> 启用 / 禁用 / 编译为模块
#   整数              -> CONFIG_X=1234
#   其他字符串        -> CONFIG_X="字符串"
# YAML 里 true/false 会分别当作 y/n 处理。
#
# 应用顺序：gki_defconfig -> 逐条 scripts/config -> make olddefconfig -> 回读校验。
# 若某项因依赖不满足被 Kconfig 丢弃，构建会失败并列出差异（不会静默降级）。
# ------------------------------------------------------------------
config:
  CONFIG_SYSVIPC: y
  CONFIG_IPC_NS: y
  CONFIG_PID_NS: y
  CONFIG_LRU_GEN_ENABLED: y
  CONFIG_LOCALVERSION: "-aqnya"
  CONFIG_NTSYNC: y
  CONFIG_TCP_CONG_ADVANCED: y
  CONFIG_TCP_CONG_BBR: y
  CONFIG_DEFAULT_BBR: y
  CONFIG_DEFAULT_TCP_CONG: bbr
  CONFIG_TCP_CONG_BIC: n
  CONFIG_TCP_CONG_WESTWOOD: n
  CONFIG_TCP_CONG_HTCP: n
  # 默认队列算法 = fq（配合上面的 BBR：TCP 栈塞进 sk_pacing_rate 的 pacing 只有 fq 会照做，
  # 见 net/sched/Kconfig 的 FQ 说明）。三项缺一不可：
  #   NET_SCH_DEFAULT 不打开的话，下面的 DEFAULT_FQ 会被 Kconfig 直接丢掉（回读校验会报错）
  #   NET_SCH_FQ 必须内置（=y）——默认 qdisc 是 late_initcall 里按名字查注册表设的，
  #   模块还没加载。gki_defconfig 里本来就是 y，这里显式钉住防漂移
  CONFIG_NET_SCH_DEFAULT: y
  CONFIG_NET_SCH_FQ: y
  CONFIG_DEFAULT_FQ: y
  
  # watchdog_thresh=60：softlockup 看门狗是 GKI 侧仅剩的、编译期可动的高频周期唤醒源。
  # 默认 10 时每个 CPU 都挂一个 HRTIMER_MODE_REL_PINNED_HARD 的 watchdog hrtimer
  # （sample_period = 2*thresh * 1/5 s），8 核合计约每秒数次；这正是"待机功耗边界"
  # 笔记里说的"纯为调试的唤醒"。60 把周期拉长 6 倍（探测阈值从 20s 提到 120s，
  # 仍在检测，只是报出更晚），且运行期 `echo 10 > /proc/sys/kernel/watchdog_thresh`
  # 可随时改回——不刷机即可 A/B。因为 CONFIG_SOFTLOCKUP_DETECTOR 是布局红线
  # （touch_softlockup_watchdog 是厂商模块依赖的导出符号），这里只能走 cmdline。
  CONFIG_CMDLINE: "stack_depot_disable=on kasan=off kvm-arm.mode=protected cgroup_disable=pressure noirqdebug rcupdate.rcu_expedited=0 kernel.panic_on_rcu_stall=0 rcu_nocbs=all watchdog_thresh=60"

  CONFIG_CPU_IDLE_GOV_TEO: n
  CONFIG_SCHED_WALT: y
  CONFIG_CPU_IDLE_GOV_QCOM_LPM: y
  CONFIG_ARM_QCOM_CPUFREQ_HW: y
  CONFIG_RCU_LAZY_DEFAULT_OFF: n
  # WQ_WATCHDOG 的 wq_watchdog_timer_fn 是一个每 30s 触发一次的定时器（会遍历所有
  # workqueue pool 查 stall），纯调试用。它只声明 wq_watchdog_touch() 这个 static
  # inline 存根（include/linux/workqueue.h:659），不在任何 struct 定义里、不在
  # abi-pinned-configs.txt、也不在 kmi-required-symbols.txt，关掉只少一次周期唤醒。
  CONFIG_WQ_WATCHDOG: n
  # CONFIG_KSU: y
  # CONFIG_DEBUG_INFO: n
  # CONFIG_SOME_MODULE: m
  # CONFIG_CMDLINE: "androidboot.console=ttyMSM0"
