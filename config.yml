# gki-builder 唯一配置入口
#
# 改这里 + 推送到 main（或在 Actions 页面手动 Run workflow）就会触发编译。
# 触发路径过滤见 .github/workflows/build.yml 的 on.push.paths。

kernel:
  # Android 内核 manifest 仓库 —— 源码用 `repo init/sync` 拉取，这里给 repo init -u
  repo: https://android.googlesource.com/kernel/manifest
  # manifest 分支。注意：**这里带 common- 前缀，kernel/common 的分支名不带**。
  #   kernel/manifest -> common-android13-5.15      （repo init -b 用这个）
  #   kernel/common   -> android13-5.15             （manifest 里 project 的 revision）
  # 其它可选：common-android14-5.15 / common-android14-6.1 / common-android15-6.6 ...
  branch: common-android13-5.15
  # 指定编译的 commit —— 唯一来源就在这里，钉的是 kernel/common 的 SHA。
  #   留空 ""          -> 用 manifest 给出的 revision（分支 tip）
  #   填 40 位 SHA     -> 精确钉死（推荐，保证可复现）
  commit: ""

# 生成 .config 用的 defconfig 目标
defconfig: gki_defconfig
arch: arm64

toolchain:
  # CLANG_VERSION 默认从内核树 common/build.config.constants 自动读取。
  # android13-5.15 / common-android13-5.15 对应 r450784e。留空 = 自动；填了则覆盖。
  clang_version: ""

sync:
  # repo sync 拉哪些项目。留空 = 用默认集合（内核源码 + make 需要的工具链/构建工具），
  # 只 sync 需要的能省不少磁盘和时间。要更多项目（比如 virtual-device）就在这里加。
  projects: []

# 刷机包（AnyKernel3）。模板本体在 ak3/ 目录里，构建时直接用它，不再 clone 上游。
ak3:
  # 刷机包里显示的 kernel.string（recovery 刷入时打印的那行）。
  #   留空 ""   -> 用 ak3/anykernel.sh 里自己写的那串；它还是上游示例时才自动填
  #               "GKI <branch> (<sha12>)"
  #   填字符串  -> 每次构建都强制写成这串
  kernel_string: ""

# ------------------------------------------------------------------
# 开关 config：value 即写入 .config 的取值
#   y / n / m         -> 启用 / 禁用 / 编译为模块
#   整数              -> CONFIG_X=1234
#   其他字符串        -> CONFIG_X="字符串"
# YAML 里 true/false 会分别当作 y/n 处理。
#
# 应用顺序：gki_defconfig -> 逐条 scripts/config -> make olddefconfig -> 回读校验。
# 若某项因依赖不满足被 Kconfig 丢弃，构建会失败并列出差异（不会静默降级）。
# ------------------------------------------------------------------
config:
  CONFIG_SYSVIPC: y
  CONFIG_IPC_NS: y
  CONFIG_PID_NS: y
  CONFIG_LRU_GEN_ENABLED: y
  CONFIG_LOCALVERSION: "-aqnya"
  CONFIG_NTSYNC: y
  CONFIG_TCP_CONG_ADVANCED: y
  CONFIG_TCP_CONG_BBR: y
  CONFIG_DEFAULT_BBR: y
  CONFIG_DEFAULT_TCP_CONG: bbr
  CONFIG_TCP_CONG_BIC: n
  CONFIG_TCP_CONG_WESTWOOD: n
  CONFIG_TCP_CONG_HTCP: n
  # 默认队列算法 = fq（配合上面的 BBR：TCP 栈塞进 sk_pacing_rate 的 pacing 只有 fq 会照做，
  # 见 net/sched/Kconfig 的 FQ 说明）。三项缺一不可：
  #   NET_SCH_DEFAULT 不打开的话，下面的 DEFAULT_FQ 会被 Kconfig 直接丢掉（回读校验会报错）
  #   NET_SCH_FQ 必须内置（=y）——默认 qdisc 是 late_initcall 里按名字查注册表设的，
  #   模块还没加载。gki_defconfig 里本来就是 y，这里显式钉住防漂移
  CONFIG_NET_SCH_DEFAULT: y
  CONFIG_NET_SCH_FQ: y
  CONFIG_DEFAULT_FQ: y
  
  CONFIG_CMDLINE: "stack_depot_disable=on kasan=off kvm-arm.mode=protected cgroup_disable=pressure noirqdebug"

  # ---- cpuidle：用厂商的 qcom-lpm 替代 TEO ----
  # 厂商内核默认 governor 就是 qcom-lpm（见 device/power-tune.sh：
  # current_governor=qcom-cpu-lpm）。GKI 默认是 teo，这里关掉 teo、开回移的
  # qcom-lpm。rating：qcom-lpm=50 > menu=20，所以 qcom-lpm 会成为默认；
  # menu 保留作运行时兜底（echo menu > cpuidle/current_governor 可切回）。
  # 补丁 0090-cpuidle-qcom-lpm.patch；WALT 相关的 bias 逻辑因 GKI 不带
  # CONFIG_SCHED_WALT 而自动编译掉，其余（预测/cluster/PM QoS 通知）完整保留。
  CONFIG_CPU_IDLE_GOV_TEO: n
  CONFIG_CPU_IDLE_GOV_QCOM_LPM: y

  # ---- 省电批次 3：RCU 惰性回调 —— ❌ 实测不开机（卡第一屏），永久停用 ----
  # 把 CONFIG_RCU_LAZY_DEFAULT_OFF 从 y 翻成 n（= 让 enable_rcu_lazy 默认 true）后，
  # 2026-09-24 刷入卡第一屏。与之前几次变砖不同：check_kmi / check_abi_pinned 全绿，
  # 不是符号或结构体布局问题，是纯运行时行为。可能机制：lazy 把回调攒批、推迟 GP，
  # 而设备带 kernel.panic_on_rcu_stall=1 —— 早期启动阶段一旦触发 RCU stall 就 panic。
  # 结论：在能抓到日志（pstore / console）并确认 rcu_nocbs 真覆盖全部 CPU 之前，
  # 不要再动这一项。保持 gki_defconfig 原值（DEFAULT_OFF=y，lazy 关闭）。
  # CONFIG_RCU_LAZY_DEFAULT_OFF: n
  # CONFIG_KSU: y
  # CONFIG_DEBUG_INFO: n
  # CONFIG_SOME_MODULE: m
  # CONFIG_CMDLINE: "androidboot.console=ttyMSM0"
