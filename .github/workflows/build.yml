name: Build GKI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - config.yml
      - 'patches/**'

permissions:
  contents: read

concurrency:
  group: gki-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GitHub 只保证 14GB 可用空间，内核源码 + clang + out/ 会超。
      # 先删掉 runner 上用不到的大件（官方 workaround 见 actions/virtual-environments#2840）。
      - name: Free disk space
        run: |
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/lib/node_modules \
            "$AGENT_TOOLSDIRECTORY" || true
          sudo docker rmi $(docker image ls -aq) 2>/dev/null || true
          sudo apt-get clean || true
          df -h /

      # 链接阶段 OOM 是 CI 上内核编译最常见的死因
      - name: Add swap
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 16

      - name: Ensure PyYAML
        run: python3 -c "import yaml" 2>/dev/null || pip install --quiet pyyaml

      - name: Parse config.yml
        id: cfg
        run: |
          set -euo pipefail
          eval "$(python3 scripts/parse_config.py config.yml --shell)"
          python3 scripts/parse_config.py config.yml --config-list > /dev/null

          # clang 版本：优先 config.yml 覆盖，否则向源码仓库取 build.config.constants。
          # 只用于给缓存起一个准确的 key；build.sh 会以检出的内核树为准再核一次。
          CLANG_VER="${TOOLCHAIN_CLANG_VERSION}"
          if [ -z "$CLANG_VER" ]; then
            CLANG_VER="$(curl -fsSL --retry 3 \
              "${KERNEL_REPO}/+/refs/heads/${KERNEL_BRANCH}/build.config.constants?format=TEXT" \
              | base64 -d 2>/dev/null | sed -n 's/^CLANG_VERSION=//p' | head -1 | tr -d '[:space:]' \
              || true)"
          fi

          {
            echo "clang_version=${CLANG_VER}"
            echo "kernel_branch=${KERNEL_BRANCH}"
            echo "kernel_commit=${KERNEL_COMMIT}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "KERNEL_REPO=${KERNEL_REPO}"
            echo "KERNEL_BRANCH=${KERNEL_BRANCH}"
            echo "KERNEL_COMMIT=${KERNEL_COMMIT}"
            echo "TOOLCHAIN_CLANG_VERSION=${TOOLCHAIN_CLANG_VERSION}"
            echo "TOOLCHAIN_CLANG_BRANCH=${TOOLCHAIN_CLANG_BRANCH}"
          } >> "$GITHUB_ENV"

          echo "分支: ${KERNEL_BRANCH}  commit: ${KERNEL_COMMIT:-'(分支最新)'}  clang: ${CLANG_VER:-'(自动)'}"

      # 目录名带上版本号：即使缓存 key 撞错，build.sh 找的也是带版本的路径，
      # 找不到就自己重新下载，绝不会误用别的 clang。
      - name: Cache AOSP clang
        if: steps.cfg.outputs.clang_version != ''
        uses: actions/cache@v4
        with:
          path: toolchain/clang-${{ steps.cfg.outputs.clang_version }}
          key: aosp-clang-${{ steps.cfg.outputs.clang_version }}

      - name: Build
        run: bash scripts/build.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gki-${{ steps.cfg.outputs.kernel_branch }}-${{ github.run_number }}
          path: |
            dist/Image
            dist/Image.gz
            dist/*.dtb
            dist/*.dtbo
            dist/*.lz4
            dist/AnyKernel3.zip
            dist/kernel.config
          if-no-files-found: error
          retention-days: 14

      - name: Disk usage
        if: always()
        run: df -h /
