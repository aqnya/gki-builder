name: Build GKI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - config.yml
      - 'patches/**'

permissions:
  contents: read

concurrency:
  group: gki-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # GitHub 只保证 14GB 可用空间，repo 同步（含 clang prebuilts）+ out/ 会超。
      # 先删掉 runner 上用不到的大件（官方 workaround 见 actions/virtual-environments#2840）。
      - name: Free disk space
        run: |
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/lib/node_modules \
            "$AGENT_TOOLSDIRECTORY" || true
          sudo docker rmi $(docker image ls -aq) 2>/dev/null || true
          sudo apt-get clean || true
          df -h /

      # 链接阶段 OOM 是 CI 上内核编译最常见的死因
      - name: Add swap
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 16

      - name: Ensure PyYAML
        run: python3 -c "import yaml" 2>/dev/null || pip install --quiet pyyaml

      - name: Install repo tool
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL --retry 3 \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/repo" --version 2>&1 | head -5

      - name: Parse config.yml
        id: cfg
        run: |
          set -euo pipefail
          eval "$(python3 scripts/parse_config.py config.yml --shell)"
          python3 scripts/parse_config.py config.yml --config-list > /dev/null

          {
            echo "kernel_repo=${KERNEL_REPO}"
            echo "kernel_branch=${KERNEL_BRANCH}"
            echo "kernel_commit=${KERNEL_COMMIT}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "KERNEL_REPO=${KERNEL_REPO}"
            echo "KERNEL_BRANCH=${KERNEL_BRANCH}"
            echo "KERNEL_COMMIT=${KERNEL_COMMIT}"
            echo "TOOLCHAIN_CLANG_VERSION=${TOOLCHAIN_CLANG_VERSION}"
            echo "SYNC_PROJECTS=${SYNC_PROJECTS}"
          } >> "$GITHUB_ENV"

          echo "manifest: ${KERNEL_BRANCH}  commit: ${KERNEL_COMMIT:-'(manifest 给出的 revision)'}"

      # repo 每次都要重新 clone，缓存 git 对象目录能让后续 sync 明显变快。
      # 命中失败只是变慢，不会用错内容。
      - name: Cache repo objects
        uses: actions/cache@v5
        with:
          path: .work/src/.repo/project-objects
          key: repo-objects-${{ steps.cfg.outputs.kernel_branch }}-${{ github.run_id }}
          restore-keys: |
            repo-objects-${{ steps.cfg.outputs.kernel_branch }}-
      # lz4 用于产出 Image.lz4（Image.gz 只依赖 gzip，始终会有）
      - name: install build tools and dep
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libelf-dev lz4

      - name: Build
        run: bash scripts/build.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gki-${{ steps.cfg.outputs.kernel_branch }}-${{ github.run_number }}
          path: |
            dist/Image
            dist/Image.gz
            dist/*.lz4
            dist/dtb
            dist/dtbo.img
            dist/AnyKernel3.zip
            dist/kernel.config
          if-no-files-found: error
          retention-days: 14

      - name: Disk usage
        if: always()
        run: df -h /
